services:
    # ------------------------------------------------------------------
    # PHP test runner - built from Dockerfile (extensions + Composer pre-baked)
    # ------------------------------------------------------------------
    php:
        build:
            context: .
            dockerfile: Dockerfile
        working_dir: /app
        volumes:
            - .:/app
            # The bind mount above covers the vendor/ the image installed, so this puts it back.
            # Anonymous and not named on purpose: a named volume is seeded from the image once and
            # then shadows every later build, so a dependency bump left the old install in place --
            # PHPUnit stayed at 9 under a composer.json asking for 13, and the suite died on an
            # option that version had never heard of. An anonymous volume is made fresh for each
            # one-off container, so what runs is what the image installed.
            - /app/vendor
        depends_on:
            mysql:
                condition: service_healthy
            postgres:
                condition: service_healthy
        environment:
            GOBL_TEST_MYSQL_HOST: mysql
            GOBL_TEST_MYSQL_PORT: 3306
            GOBL_TEST_MYSQL_DB: gobl_test
            GOBL_TEST_MYSQL_USER: gobl_test
            GOBL_TEST_MYSQL_PASSWORD: g0bl@Test
            GOBL_TEST_POSTGRESQL_HOST: postgres
            GOBL_TEST_POSTGRESQL_PORT: 5432
            GOBL_TEST_POSTGRESQL_DB: gobl_test
            GOBL_TEST_POSTGRESQL_USER: gobl_test
            GOBL_TEST_POSTGRESQL_PASSWORD: g0bl@Test
            GOBL_TEST_SQLITE_FILE: ":memory:"

    # ------------------------------------------------------------------
    # MySQL 8
    # ------------------------------------------------------------------
    mysql:
        image: mysql:8.0
        environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: gobl_test
            MYSQL_USER: gobl_test
            MYSQL_PASSWORD: g0bl@Test
        # A test database is thrown away at the end of the run, so it never needs to reach a disk:
        # the engine's own filesystem fsyncs every commit through to the host, which a suite feels
        # on every write it makes. It also means each run starts on an empty server.
        tmpfs:
            - /var/lib/mysql
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "--silent"]
            interval: 2s
            timeout: 5s
            # Generous on purpose: the server initialises from nothing on every run now, and a
            # health check that gives up first fails the suite with nothing wrong in the code.
            retries: 60

    # ------------------------------------------------------------------
    # PostgreSQL 15
    # ------------------------------------------------------------------
    postgres:
        image: postgres:15
        environment:
            POSTGRES_DB: gobl_test
            POSTGRES_USER: gobl_test
            POSTGRES_PASSWORD: g0bl@Test
        # Thrown away at the end of the run, as above.
        tmpfs:
            - /var/lib/postgresql/data
        healthcheck:
            test: ["CMD", "pg_isready", "-U", "gobl_test"]
            interval: 2s
            timeout: 5s
            retries: 60
